  - id: SELF-9
    title: my ordering change broke the videogen lane; two precision lists disagreed
    found_by: T084 Fable review, confirmed by running the lane
    detail: |
      The cheapest-first reorder I dispatched (user round-2 decision "make Go
      match Python") exposed a pre-existing disagreement. Two independent lists
      answer the same question:
        cmd/videogen-boot/modelchoice.go  servingPrecisions      said gguf-q4 servable
        services/videogen/videogen_server.py _UNIMPLEMENTED_PRECISIONS refuses gguf-q4
      Nothing noticed while most-capable-first happened to rank a servable fp8
      build first. Cheapest-first put wan2.2-t2v-a14b:gguf-q4-480p (8 GiB) ahead
      of the servable wan2.2-ti2v-5b:fp8-480p (10 GiB).
      REPRODUCED: `go run ./cmd/videogen-boot plan` chose the gguf-q4 build. The
      lane would admit the VRAM, compose up, 503 for the full health timeout,
      exit 4 — holding the lease throughout. A correct-looking plan to a dead
      container.
      FIXED: removed gguf-q4 from servingPrecisions (the service is authoritative
      — it is the thing that loads weights). Lane now chooses fp8-480p again.
      GUARDED: internal/serviceconfig/precision_agreement_test.go parses both
