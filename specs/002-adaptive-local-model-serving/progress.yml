  - id: EX-15
    where: submodules/helix_llm/cmd/visiongen-boot/vision_boot_test.sh:119
    what: >-
      A PASS-BLUFF MECHANISM in the very script whose purpose is proving the
      vision endpoint genuinely works.
      `base64 -w0` is a GNU coreutils extension; BSD/macOS base64 has no -w. The
      script runs under `set -u` but NOT `set -e` and NOT `pipefail`, so on a
      non-GNU host the encode fails silently, B64 is left empty, and the payload
      becomes the literal "data:image/png;base64," — an empty image.
      The downstream assertion only requires non-empty, non-bluff-keyword prose.
      A vision model can answer "Describe this image in one short sentence" from
      the TEXT prompt alone. Result: a PASS claiming the endpoint described an
      image it never received — a sink-side bluff at exactly the layer this
      script exists to close.
      FIXED: portable `base64 | tr -d '\n'` plus an explicit emptiness guard that
      converts a silent empty encode into a loud, named failure. Verified on
      Linux to produce byte-identical output to the old form on real input.
    severity: HIGH
    status: fixed

