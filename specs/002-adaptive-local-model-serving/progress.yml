  - id: SECURITY-2
    where: submodules/helix_llm/internal/discovery/trust.go:212 + discover.go:193,459
    what: >-
      PROOF RELAY — A HOST HOLDING NO SECRET AT ALL BECOMES TRUSTED AND RECEIVES
      THE PROMPT AND CREDENTIALS. Reproduced on the wire by the security review,
      in two variants.
      ROOT CAUSE: the proof is HMAC(secret, nonce) with NO CHANNEL BINDING —
      nothing ties it to the endpoint we dialed. Any host that can reach one
      genuine instance answers our challenge by forwarding it.
        - REDIRECT: hostile /attest answers 302 to the honest instance. New()
          builds &http.Client{Timeout} with NO CheckRedirect, so the honest
          instance's proof returns as the hostile endpoint's response.
          trusted=true, then Send posted the prompt to the hostile endpoint.
        - ACTIVE PROXY: hostile fetches the honest attest itself, rewrites `host`
          and `models`, returns it. trusted=true, ServedOptions carried an
          attacker-chosen model under a host label colliding with the real one,
          and Send delivered prompt AND credentials.
      WHY THE EXISTING TEST PASSED: its hostile server returns a GARBAGE proof
      rather than relaying a real one. The test proves an unauthenticated host is
      refused; it never tested a host that obtains a valid proof by other means.
      So FR-024/FR-025 hold only against an attacker alone on the network.
      FIX DIRECTION (from the review, not yet applied): bind the dialed endpoint
      into the MAC input — HMAC(secret, nonce || endpoint) — and set CheckRedirect
      to refuse on both probe and Send.
    severity: CRITICAL (security)
    status: open — reproduced, fix dispatched

  - id: SECURITY-3
    where: submodules/helix_llm/internal/discovery/discover.go:305
    what: >-
