    status: recorded — recovery is an operator decision

  - id: CRITICAL-5
    where: internal/selection/fit.go:320,373 · internal/runtime/choose.go:334 · placement.go:426
    what: >-
      SELECTION NEVER READS ACCELERATOR MEMORY. Every accelerator-required model
      is fitted against SYSTEM RAM. Verified by grep: `Accelerator.MemoryAvailable`
      and `.MemoryTotal` are referenced ZERO times across internal/selection,
      internal/runtime and both boot binaries; the same files reference the
      HOST's MemoryAvailable six times. `supports()` checks only
      len(Accelerators)==0 — presence, never capacity.
      THE FIGURES BEING COMPARED ARE NOT THE SAME QUANTITY. The catalogue's
      memory_required_bytes for accelerator entries is a VRAM figure —
      vision_image.yaml records 4338987008 annotated "4138 MiB actual GPU peak
      for the VLM alone, co-resident with a live 30B coder on one RTX 5090". That
      VRAM number is compared against host RAM.
      REPRODUCED: a host with 48 GiB RAM free and a card with 7 GiB free was
      OFFERED an entry requiring 24 GiB of VRAM.
      THE LIVE CORROBORATION IS THE WORST PART: imagegen-boot on THIS host
      withheld qwen-image:fp8 as "memory short by 1918MiB (needs 15258MiB,
      13339MiB available after 4646MiB held back)". 13339 MiB is RAM-minus-
      reserve. The card has 11775 MiB. The refusal was correct BY COINCIDENCE OF
      RAM SIZE, for the wrong axis. On a 64 GiB-RAM / 12 GiB-card host the same
      model would print PLAN-OK and then fail at the broker, misattributed to
      coder co-residency.
      THREE TESTS CERTIFY THE BUG:
        - selection_test.go TestEveryOfferedOptionFitsTheMeasuredHost re-derives
          "fits" from host.MemoryAvailable — the oracle inherits the
          implementation's exact blind spot.
        - refusal_test.go:313 asserts a 24 GiB accelerator model "runs perfectly
          well" on a fixture card with 23.2 GiB free.
        - choose_test.go manufactures "does not fit" by shrinking RAM to 12 GiB
          while the card still has 23 GiB — certifying that the streaming
          fallback is decided from RAM for an accelerator-required entry.
      FOUND INDEPENDENTLY TWICE: the US1 reviewer via the fit path, the security
      reviewer via the fleet ledger (SECURITY-4, same VRAM promised three times).
      Two symptoms, one root cause.
      This is the central premise of the feature — measure the host, offer what
      fits — failing on the axis that matters for every accelerator model.
    severity: CRITICAL
    status: open — fix dispatched

  - id: CRITICAL-6
    where: internal/vrambroker/budget.go:20,43 + both boot compose files
    what: >-
      ADMISSION BINDS THE ACCELERATOR BY ENUMERATION POSITION. nvidiaSMIArgs
      carries no --id=<uuid>, and parseSMICSV is documented as parsing "the FIRST
      GPU row" and returns on the first line. selection.Option carries no device
      identity at all; needBytesFor admits a bare byte count. The compose files
      pass nvidia.com/gpu=all with no CUDA_VISIBLE_DEVICES pin, and the service
      calls torch.cuda.get_device_name(0).
      REPRODUCED: two nvidia-smi rows (24576, 12288) gave budget total 24576;
      reversed, 12288. The budget depends on enumeration order.
      THE IRONY WORTH RECORDING: DeviceIdentity was made a distinct type
      specifically so an index could not be assigned to it — §11.4.111 enforced
      by the compiler. That worked. And then nothing downstream represents the
      identity at all, so the guarantee stops at the package boundary. CUDA and
      nvidia-smi order differ by default, so on a two-card host admission and
      execution can target different cards.
    severity: CRITICAL
    status: open — fix dispatched

