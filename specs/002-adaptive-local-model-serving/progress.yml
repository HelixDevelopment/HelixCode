  - id: OPEN-19
    title: two integration model-listing tests fail at baseline
    detail: |
      TestIntegration_OpenAI_ListModels and TestLlamaCppOnly_ModelsEndpoint fail
      with "0 is not greater than 0: should return at least one model".
      THREE independent agents each proved these pre-date their work — one by
      path-limited stashing and re-running at baseline, one via `go list -deps
