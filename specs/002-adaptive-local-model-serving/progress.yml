      exempt from FR-024 by construction. Reproduced: LocalHostEndpoints set to a
      LAN address, no secret, attest with no proof field -> trusted=true, and Send
      delivered the prompt. The "beyond the current host" boundary is enforced by
      configuration trust rather than by code, so a hostile .env or a hostname
      that resolves off-box exports user content unauthenticated.
    severity: HIGH (security)
    status: open — fix dispatched

