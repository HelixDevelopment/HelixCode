  - id: SECURITY-1-helix_code
    title: unexpanded ${...} in a credential was used verbatim as the credential
    detail: |
      REPRODUCED then FIXED in helix_code/internal/config (distinct from the
      helix_llm instance, which is dispatched separately).
      A dead agent had left a complete RED suite and no implementation. All 11
      credential fields accepted an unexpanded placeholder, plus the
      ${VAR:default}, ${VAR:-default} and embedded prefix-${VAR}-suffix forms.
      Worst case is auth.jwt_secret: with HELIX_AUTH_JWT_SECRET unset, every JWT
      was signed with the literal string "${HELIX_AUTH_JWT_SECRET}" — a constant
      committed to this repository, readable by anyone — while startup, health
      checks and tests all reported success.
      FIXED: checkSecretPlaceholders runs first in validateConfig and refuses,
      naming both the field and the variable to export.
      SCOPE is deliberately narrow (an explicit credential list, not a
      reflective walk): non-secret fields legitimately carry ${...} in normal
      operation — config/config.yaml ships ${HELIX_LLM_ENDPOINT:...} and
      ${HELIX_QA_HOME}/banks — so a blanket scan would refuse the project's own
      shipped config. The test pins this via NonSecretFieldsAreNotScanned.
      A bare $VAR is NOT refused: it is not a form this loader expands, so it is
      a real secret, and refusing it would lock a user out of their own config.
      EVIDENCE: 25 assertions across 5 tests; paired §1.1 mutation proven by
      diff (regex neutered -> FAIL; restored -> PASS).
    severity: CRITICAL
    status: fixed + guarded

