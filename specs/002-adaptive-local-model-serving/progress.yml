  - id: SECURITY-2-3-4-resolved
    title: attestation proof was not bound to who answered; now channel-bound and address-pinned
    detail: |
      Two rounds, both reproduced before fixing.
      ROUND 1 (3efc367). Proof was HMAC(secret, nonce) — it answered "do you hold
      the secret" and said NOTHING about who answered. Any host able to reach a
      genuine instance could obtain a real answer to OUR OWN nonce and present it
      as its own, by redirecting us to one or by proxying our challenge to one.
      Both reproduced with the user's prompt, an opened file's contents, and the
      upstream credential arriving at a hostile host.
      FIX: HMAC(secret, nonce || 0x00 || audience) where the audience is the
      SOCKET ADDRESS and is NEVER TRANSMITTED — the responder signs its own
      accepted-connection LocalAddr, the client checks its own RemoteAddr. Two
      ends of one socket, so an honest direct instance agrees by construction.
      That is what defeats the proxy specifically: it may forward every byte we
      send and still cannot make an honest instance sign an address that is not
      its own. A Host-header-derived audience would NOT have covered a
      transparent byte-forwarding TCP relay; this does.
      Redirects are refused outright during attestation — the party answering the
      challenge must be the party we send content to.
      ROUND 2 (6e278e8). The binding was established on the PROBE's connection;
      Send opened a new one and re-resolved the name, so a name pointing at the
      attested instance during the probe and elsewhere at send time was not
      caught. Reproduced: all three canaries at a host that never held the secret.
      FIX: Instance.VerifiedAddr carries the verified peer forward (following
      PeerLoopback's precedent) and Send dials it through a client copy with a
      fixed DialContext, so the URL keeps its scheme/host/path and the Host
      header and TLS SNI still use the configured name.
      Two silent bypasses of a fixed dialler are REFUSED rather than ignored: a
      transport with DialTLSContext (never calls DialContext, so https would
      re-resolve) and a proxy that actually applies (the proxy picks the peer).
      An Instance with no verified address is refused BEFORE the body is
      marshalled — a silent fallback to re-resolution IS the hole, and it would
      look like it worked.
      ALSO FIXED en route: the local-host attestation exemption was granted on
      which CONFIG LIST an endpoint appeared in, not on whether the address was
      really loopback. A LAN address in LocalHostEndpoints turned the requirement
      off for that host. Now decided from the actually-connected peer, with a
      pre-dial filter so a host we could never authenticate does not even learn
      we are looking.
    severity: CRITICAL
    status: fixed + guarded

  - id: OPEN-20
    title: pinning is per-Instance, so a re-addressed instance needs a fresh Discover
    detail: |
      Behaviour change from the Send pinning fix, flagged by the agent rather
      than buried: an instance that legitimately changes address (DHCP lease,
      container restart) will not be reached by Send until it is discovered
      again. That is the correct trade — the alternative is re-resolution, which
      is the hole — but operators should know.
      Also noted: Send has no redirect policy of its own the way attestation
      does. Not a hole (the body already reached the pinned peer, and the
      redirect is dialled through the same pinned transport), but asymmetric.
    severity: LOW
    status: recorded — behaviour change, not a defect

  - id: FR-017-018-resolved
    title: the HelixCode and OpenCode exporters had no caller at all
    detail: |
      CONFIRMED. ExportHelixCode, ExportOpenCode and the Merge* functions were
      defined, unit-tested, and referenced by NOTHING outside internal/naming.
      The only non-Go references were two snippets in docs/guides that tell a
      user to import internal/naming — not importable from outside the module.
      So the artifacts were genuinely unobtainable by any user, and the
      requirement that users can obtain their configuration on demand was met
      only for the Claude Toolkit.
      GIT HISTORY CHECKED FIRST per 11.4.124: `git log -S` across all history
      shows they arrived in 1b66afb WITH their unit tests and no caller was ever
      added. Never-completed wiring, not wiring that rotted — so completing it
      was right, and removing it would have been wrong.
      FIXED: served from the same gateway the toolkit already reads models from
      — GET /v1/config/{helixcode,opencode} and POST /v1/config/{consumer}/merge
      (body in, merged content back, never writes to disk). The base URL handed
      out is the address the request arrived on, upgraded on X-Forwarded-Proto
      and never downgraded. Multiple serving hosts produce a 400 naming them
      rather than a silent pick.
      The test drives the real gin router end to end — testing the exporter
      function in isolation is what proved nothing about reachability.
    severity: HIGH
    status: fixed + guarded

  - id: SC-015-resolved
    title: the published identity named 127.0.0.1, so it named no machine and collided across machines
    detail: |
      CONFIRMED, with one sub-claim REFUTED.
      ServingHost() returned the base URL's hostname, and the embedded
      llama-server path forces 127.0.0.1 — the normal case. So the identity was
      helixllm/127.0.0.1/<model>: it names no machine, and it is IDENTICAL on
      every machine. The collapse is real and was verified in the toolkit
      source: claude-providers.sh does `group_by(.provider_id) | map(.[0])`
      over MULTIPLE enumerated hosts, so the second host is silently dropped.
      Captured RED on the pre-fix tree:
        ServingHost() for http://127.0.0.1:8080 = "127.0.0.1", want "anton"
        127.0.0.1 derives helixllm-127-0-0-1-llama3-41cc1e4fdbc7
        localhost derives helixllm-localhost-llama3-9235d4f540fa
      REFUTED sub-claim: "OpenAI-compatible local backends get no identity and
      are silently dropped." The filter is real but DELIBERATE — in this codebase
      the OpenAI-compat path serves only remote vendors, and stamping identities
      on proxied vendor models is what the design explicitly forbids. Left alone.
      FIXED: loopback and wildcard hosts resolve to os.Hostname(); a base URL
      already naming a real machine is untouched; a machine that cannot say what
      it is called yields the URL host rather than a fabricated name.
      COST STATED PLAINLY: every identifier for a locally served model changes
      ONCE. Judged worth paying because those names were wrong (they pointed at
      no machine and collided), it is the LAST re-mint of this class (both
      loopback spellings now converge, where flipping the env var used to re-mint
      silently and repeatedly), and the naming SCHEME is untouched — the golden
      file pinning it needed no change.
    severity: HIGH
    status: fixed + guarded

  - id: CHALLENGES-triage
    title: all 83 challenge failures classified; 5 fixed; none converted to skips
    detail: |
      Measured 20 passed / 83 failed / 28 skipped — the remembered 83 is right.
      The 28 skips are honest (benchmark/chaos steps with no executor, already
      surfaced as a non-zero exit).
      ALL 83 accounted for in 8 root-cause groups, none left unclassified:
        G1  51  no LLM backend reachable          environmental
        G2a 11  no semantic request validation    REAL DEFECT
        G2b  3  auth expects 401, server open     config
        G3   5  provider outage reported 500      REAL DEFECT — FIXED
        G4   4  /v1/models returns data: null     REAL DEFECT
        G5   6  /health 503, no provider          environmental
        G6   1  p99 latency budget                environmental / test
        G7   1  models/:id 404 (downstream of G4) environmental
        G8   1  RAG ingest shape                  UNDETERMINED, honestly
      The environmental class was PROVEN, not assumed: nothing listening on
      :50052, llama-server present but zero .gguf files anywhere under $HOME.
      NONE were converted to skips — that would have rebuilt the always-passing
      harness defect this session just removed.
      The previous agent's dying lead ("every malformed and unauthenticated
      request reaches provider dispatch") was CONFIRMED for malformed and
      REFUTED for auth: open-access is documented as by-design, so those 3
      challenges assume a keyed deployment they never declare.
      FIXED G3 only — the highest-impact real defect with a spec the project's
      own banks already declare ([404,503]). Suite 83 -> 79.
      One apparent NEW failure (500_concurrent_model_list) was TESTED rather
      than assumed: across three runs the UNFIXED binary fails it more often and
      more severely. A host-load-sensitive flake that was passing by luck.
    severity: HIGH
    status: triaged; 1 of 3 real-defect groups fixed
    next: G4 (smallest), then decide the G2a validation policy once for both handlers

  - id: HXA-netaddr-1
    title: an unpaired bracket in a configured host silently becomes a connection to ::1
    detail: |
      Found while accounting for uncommitted work in helix_agent. The failure is
      on COMMITTED code — proven not to be anyone's in-flight work: netaddr is
      unmodified in the tree, and `go list -deps -test` shows zero dependency
      edges to the packages that do have uncommitted changes.
      The test asserts url.Parse REFUSES the URL built from host "[[::1]".
      Probed the stdlib directly on go1.26.0:
        "http://[[::1]:6379"  PARSED  hostname="::1" port="6379"
        "http://[[::1]]:6379" REFUSED
      So Go SILENTLY DISCARDS the stray leading bracket and yields a real,
      connectable destination.
      The test's stated danger — "a mutant that makes it parse invents a
      destination" — is exactly right. Its assumption that url.Parse would catch
      it is wrong. Nothing catches it: an operator who mistypes a bracket in a
      configured host gets a silent connection to ::1 instead of an error.
      A gate that is RIGHT about the danger and WRONG about the mechanism.
    severity: HIGH
    status: open — dispatched

  - id: SELF-11
    title: I nearly misread my own filtered output as a finding
    detail: |
      I backgrounded `go test ./internal/... | grep -E '^(FAIL|--- FAIL)'` and
      later counted '^ok' in the log. It reported "0 packages ok", which reads
      like a catastrophe. There were no ok lines because MY OWN FILTER had
      removed them.
      PATTERN-1 a fourth time, and this time against me rather than a tool:
      absence of output is ambiguous between "clean" and "you did not capture
      it". The actual result was one failing package.
    severity: LOW
    status: recorded — lesson

  - id: OPEN-17-18-resolved
    title: selection and the broker now agree on headroom; commitments charge the card they were weighed against
    detail: |
      Both reproduced with captured output before fixing.
      GAP 1: card free=11776 MiB, model needs=10240 MiB, broker headroom=2048.
        SELECTION offers: true.  BROKER admits: false.
        A user was shown a model, chose it, and met the refusal afterwards.
      GAP 2: two 16 GiB models onto one 24 GiB card — after placement 1 the
        fleet still reported 24576 MiB free, and placement 2 succeeded.
        32 GiB committed to a 24 GiB card.
      WHERE THE HEADROOM IS STATED: internal/runtime, in SelectionReserve(),
      which READS vrambroker.HeadroomBytes rather than copying it. Pure
      selection keeps no runtime import. internal/runtime/lease.go was already
      the right seam — its own doc comment describes this exact defect ("a lane
      could offer a model the broker would then refuse, and the user met that
      refusal after choosing") and it already imports both packages.
      The composition roots are PLURAL (videogen/imagegen/visiongen-boot), so
      stating it in one would leave the others disagreeing with the gate; they
      state it by calling, not by repeating.
      THE ANTI-DRIFT TEST IS NOT A HARDCODED 2 GiB — which was the trap. It
      drives BOTH real deciders (the broker's own arithmetic, and selection
      under the reserve the binaries pass) across a sweep whose points are all
      derived from HeadroomBytes, requiring agreement at every one. Change the
      constant and the fixtures move with it; leave selection uninformed and the
      answers diverge inside the band.
      DEVICE IDENTITY: fits() records the stable DeviceIdentity the offer was
      weighed against; commit() reads it off the offer rather than re-deriving,
      so the card judged able to hold the model is the card charged, and Release
      credits the same one. Per-device rather than host-wide also buys the
      honest positive: a two-card host still takes a second model the first card
      could no longer hold.
      4 paired mutations, each diff-verified — including one that charges
      Accelerators[0] instead of the recorded identity, which fails the
      order-invariance test. That is the 11.4.111 defect reintroduced and caught.
    severity: HIGH
    status: fixed + guarded

  - id: NOTE-3
    title: how a flake was ruled out properly, worth copying
    detail: |
      internal/lifecycle/TestEvict_NeverUnloadsUnderAnInFlightRequest_Concurrent
      failed once in ~6 full-suite runs during the headroom work.
      The agent did NOT assume it was unrelated — it noted that lifecycle DOES
      import vrambroker, which is exactly the dependency edge that would make it
      its own fault. It then: reproduced the failure deterministically under
      GOMAXPROCS=1; read the failing assertion (the test's own LIVENESS
      precondition, serving-refusals=0 — "the contention window never opened" —
      while the actual FR-047 correctness invariant held at 0 violations); and
      ran the same test under the same conditions in an isolated worktree at the
      commit BEFORE its own, getting an identical failure with identical
      counters. Its whole diff was 23 insertions inside a function lifecycle
      never calls.
      That is the standard: a dependency edge exists, so prove it rather than
      asserting it. The assertion is genuinely flaky under CPU starvation and
      deserves a ticket in its owning area.
    severity: INFO
    status: recorded — and lifecycle's flaky liveness assertion is worth a ticket

  - id: OPEN-21
    title: Fleet has no production caller, so the device ledger is correct but unexercised
    detail: |
      Left open by the headroom agent. Fleet is exercised only by tests today,
      so the per-device commitment accounting it now does correctly is not yet
      reached by a shipping binary. If a production caller appears it must pass
      runtime.SelectionReserve() for the same reason the boot roots do, or it
      will reintroduce Gap 1 for its own path.
      Also noted: agentgen-boot does not use selection at all — it acquires
      against a config-derived figure — so there was nothing to wire there.
    severity: MEDIUM
    status: open

  - id: SELF-12
    title: I gave an agent a false premise and it correctly refused to act on it
    detail: |
      I framed the empty-secret decision to the operator as "an empty JWT
      signing key is as dangerous as a placeholder one, arguably worse — it
      looks intentional." The operator decided on that framing. The framing was
      WRONG for helix_llm, and the agent established it rather than implementing
      what I asked.
      What it found, with citations: every credential in that codebase is
      SELF-GATING — presence IS the enable-switch and absence is a documented
      off-state (9 provider keys gated `!= ""`; empty APIKeys means open access
      by design; RedisPassword gated by RedisHost). And Auth.JWTSecret has ZERO
      consumers: no JWT import outside tests, golang-jwt not a direct dependency,
      the auth submodule replace-only and never imported. Its own configuration
      doc says "Leave empty to disable JWT auth."
      So "must be supplied" would have refused EVERY current deployment,
      including this repo's own .env.example, which ships both auth vars blank.
      That is the outage I warned it about, and my own premise was the thing
      pointing at it.
      IT IMPLEMENTED THE CORRECT RULE INSTEAD: must be non-blank ONCE SUPPLIED.
      Not vacuous — it catches a live defect. Measured: APIKeys="" -> 200,
      APIKeys="   " -> 401 on EVERY request including the correct key,
      APIKeys="real-key" -> 200. Neither open nor protected: silent total
      lockout, from a config that validated cleanly.
      It stated prominently, not buried, that HELIX_AUTH_JWT_SECRET="" still
      loads — so the operator can see their decision was narrowed and why.
      LESSON FOR ME: I wrote a brief asserting a danger I had not verified in
      that codebase, and asked the operator to decide on it. The brief should
      have said "verify this holds here first" — which, fortunately, its
      discipline section did.
    severity: MEDIUM
    status: recorded — decision was narrowed on evidence, operator should know

  - id: HXLLM-blank-credential
    title: a whitespace-only credential locked out every request while validating cleanly
    detail: |
      Found by the empty-secrets agent while deriving required-vs-optional.
      APIKeys set to "   " passes validation, then rejects every request
      including the correct key — neither open access nor protected access, and
      nothing anywhere says why.
      FIXED: a credential must be non-blank once supplied.
      Mutation D is worth recording: echoing the OFFENDING value initially
      PASSED the whole suite, because the no-leak test only checked NEIGHBOURING
      secrets. Caught by an independent review round, fixed, re-run.
      The agent also reported hitting a U+00A0 non-breaking space that made an
      earlier assertion check for a string that never appears — the same
      false-pass class, from an invisible character.
    severity: HIGH
    status: fixed + guarded

  - id: OPEN-22
    title: Auth.JWTSecret is declared, configured, documented — and read by nothing
    detail: |
      Established while deriving the required-secret set. Declared since it was
      introduced, never read; the auth submodule is present in go.mod as a
      replace-only entry and never imported.
      NOT acted on, correctly — 11.4.124 requires investigating how a thing
      became unwired before removing it, and that investigation has not been
      done. If JWT auth is wired later, the blank-credential guard already
      covers the field.
    severity: MEDIUM
    status: open — investigate before removing or wiring

  - id: OPEN-15-CORRECTED
    title: my OPEN-15 finding was wrong; the endpoint is discarded, not mis-resolved
    detail: |
      I recorded that config/config.yaml's provider endpoint
      "${HELIX_LLM_ENDPOINT:http://localhost:8081}" was "used as a literal URL —
      a URL that is not a URL", and framed the operator's decision on it.
      That was WRONG, and the agent established it with a captured probe:
        REPRO-D  Config declares llm.providers: false
                 -> the value never reaches any Config field at all
      LLMConfig has no `providers` field, which is why `llm.providers` sits in
      inertConfigKeys. The block is DISCARDED, not mis-resolved. Expansion
      cannot reach a field that does not exist, so there was nothing there to
      fix; declaring that block is a separate change.
      The genuine expansion set turned out to be the NOTIFICATION CHANNEL
      credentials, which the notifications wiring made reachable in the same
      change — the two tasks interlocked.
      SECOND premise of mine an agent has corrected today (see SELF-12). Both
      times the agent verified rather than implementing what I asserted, which
      is the only reason neither shipped.
    severity: INFO
    status: corrected — the original finding was mine and it was wrong

  - id: HXC-notif-wired
    title: the notifications block now works, and os.Expand was eating dollar signs
    detail: |
      The block was reachable by nothing: no field on Config, so viper discarded
      it whole, and only HELIX_* environment variables ever produced a channel.
      Reproduced against a config valid in every other respect.
      NOW WIRED, with environment variables still winning and existing env-only
      deployments unchanged (verified, not assumed).
      FOUND EN ROUTE: the expander used os.Expand, which eats `$$`. Harmless
      while the five expanded fields were hostname-ish; not harmless the moment
      credentials came into scope — an SMTP password `pa$$word` came out as
      `pa`. Moved to a ${...}-only regex, which also makes the code match
      secret_placeholder.go's existing claim that a bare $VAR is never expanded.
      10 paired mutations, all diff-verified.
      Mutation M10 is worth recording: deleting a consumed field left the
      completeness guard GREEN, because the inert register downgrades that key
      regardless of the struct. That is the register working as designed, not a
      hole — but it was recorded in the test so nobody later assumes coverage
      that is not there.
    severity: HIGH
    status: fixed + guarded

  - id: HXC-prodconfig
    title: production-config.yaml had an AI transcript pasted into it and 210 lines YAML was already discarding
    detail: |
      The file was not valid YAML at all: a stray closing fence at line 569 with
      no opening fence, then "Now let me create the Phase 3 test
      implementation:" and a truncated `<function_calls>invoke<invoke name=`
      fragment. An agent's own narration, including the start of a tool call,
      written into a shipped config.
      Beneath that, six duplicate top-level blocks (workers, tasks, llm,
      logging, notifications twice). YAML keeps only the LAST occurrence, so
      210 lines were already being discarded — and they are superseded drafts,
      not stale pastes: the surviving copies carry extra keys.
      REPAIRED to exactly the extent that needed no judgement. Removal proven
      safe by the parsed configuration being BYTE-IDENTICAL before and after:
      213 lines removed, zero change to what the file configures.
      WHAT IS LEFT IS AN OPERATOR CALL AND IS NOT MADE: 22 keys — including the
      whole `environments`, `features`, `performance` and `security` sections —
      are configured at length and read by NOTHING (no Config field at any
      depth, zero direct viper reads in non-test code). Registered as inert with
      per-key reasons rather than deleted (which would discard intent nobody
      authorised discarding) or declared (which would claim the build reads
      settings it does not). Startup now says so out loud.
      Worth singling out: `logging.file` is inert while `logging.output` IS
      read, so the two can disagree and an operator editing the wrong one sees
      no effect and no explanation.
    severity: HIGH
    status: fixed to the unambiguous extent; 22 keys await an operator decision

  - id: HXA-netaddr-1-resolved
    title: a named production host was silently discarded and the connection went to loopback
    detail: |
      Far worse than the failing test row suggested, and the agent found the
      severe shape that was NOT in the test table:
        jobmanager_host="db.prod.internal[::1"
          -> "http://[db.prod.internal[::1]:8082"  -> hostname "::1"
      An operator names a production host, and the connection lands on loopback
      with no error anywhere. Proven reachable end to end from real config
      through flink.Config.GetRESTURL; JobManagerHost is a plain yaml/json
      field validated only for != "".
      MECHANISM, read from stdlib source rather than inferred: net/url's
      parseHost locates the IP-literal with strings.LastIndex(host, "[") and
      DISCARDS everything before it. And the reason a stray "[" is quiet at all
      is the other half — net.JoinHostPort brackets any colon-bearing host,
      MANUFACTURING the "]" whose absence was the only thing making "[" loud.
      Both halves are needed; neither alone bites.
      Same shape reached BaseURL from qdrant, chroma, the vectordb client,
      internal/ports and HELIX_LLM_HOST. Dial-side callers were never affected —
      SplitHostPort already rejects it — so the fix is URL-side only.
      The source carried the false claim itself: encodeGenDelims' comment listed
      "[" among bytes "already loud and deliberately left alone". That audit had
      been run on the raw host, never on the composed authority.
      FIXED by adding [ and ] to encodeGenDelims — the package's own documented
      mechanism, NOT the balanced-pair trick I had flagged as available.
      The test was reconciled, not weakened: its load-bearing assertion is now
      the invariant itself ("a malformed host must never become a WORKING
      DESTINATION — refuse, or hand back the operator's own host; never a third
      state"), with no reference to stdlib behaviour. The old url.Parse
      expectation survives demoted to a recorded go1.26 measurement.
      The third mutation is the one that matters: reverting the fix AND every
      wantURL so the other four assertions agree, leaving the new invariant to
      catch the defect alone. It does.
      281 packages ok, 0 FAIL.
    severity: HIGH
    status: fixed + guarded

  - id: HXLLM-lsp-cancel
    title: a request cancelled before it started could still complete, and was written off as flaky twice
    detail: |
      TestLSPClient_ContextCancellation was dismissed as a flake by TWO separate
      agents this session. It was not flaky. It was reporting a real coin flip.
      The test cancels the context BEFORE calling References, so an error is the
      only correct answer — there is no timing in the scenario at all. But
      `call` consulted ctx only in the select at the bottom, racing ctx.Done()
      against the response channel. With the context ALREADY cancelled and a
      response ALREADY waiting, both cases are ready and Go picks at random.
      MEASURED before: 39 PASS / 1 FAIL over 40 runs. After: 40/40 and 30/30.
      Mutation (remove the pre-check): back to 59/60. Both diff-verified.
      So an abandoned request was still written to the server, still registered
      a pending entry, and still returned its result as a success.
      THE DISTINGUISHING QUESTION, worth carrying: not how OFTEN a test fails,
      and not whether it passes in isolation — both were true here — but
      whether the scenario contains any LEGITIMATE timing. A context cancelled
      before the call contains none, so a random outcome could only be a defect.
    severity: MEDIUM
    status: fixed + guarded

  - id: OPEN-23
    title: the lifecycle flake is a different shape and needs its own fix
    detail: |
      internal/lifecycle/TestEvict_NeverUnloadsUnderAnInFlightRequest_Concurrent
      fails occasionally under CPU contention. Applying the distinction above:
      unlike the LSP case, this scenario DOES contain legitimate timing — the
      failing assertion is the test's own LIVENESS precondition
      (serving-refusals=0, "the contention window never opened"), while the
      actual FR-047 correctness invariant held at 0 violations throughout.
      So it is a genuine flake, but a badly-written one: a precondition that
      did not hold should retry until it does or SKIP with an explicit reason,
      not FAIL and imply the invariant broke. As written it generates false
      signal for every agent that runs the suite, and it already cost two of
      them time this session.
      Not fixed — it belongs to that package's owner and is out of scope here.
    severity: LOW
    status: open — worth a ticket in its owning area

  - id: TASKS-audit
    title: the 89 tasks marked done all have their named deliverables
    detail: |
      Mechanically audited our own tracking rather than trusting it: extracted
      every backticked file path from the 89 tasks marked [x] — 73 references —
      and resolved each against the meta-repo, the two submodules, the spec
      directory and the sibling claude_toolkit checkout.
      ZERO genuine misses. The first pass reported 8, all of which were my
      resolver's blind spots (a sibling repo and the spec-relative research
      directory), not absent files. Recorded because reporting those 8 as
      findings would have been a false alarm of exactly the kind this ledger
      exists to prevent.
    severity: INFO
    status: verified

  - id: FR-056-agentgen-resolved
    title: agentgen-boot took its model from configuration and its VRAM figure from a second env var
    detail: |
      The lane decided what to run from AGENTGEN_MODEL_GGUF (configuration NAMING
      the model, which FR-056 forbids) and AGENTGEN_NEED_BYTES (a hand-maintained
      duplicate of a fact about that model). Its own doc comment was candid:
      "the two env vars MUST be changed together... never assume a bigger model
      fits the smaller default."
      REPRODUCED on the real host (RTX 3060, 11781 MiB free), pre-fix binary:
        19.5 GiB model named, NEED_BYTES untouched -> need=9216MiB, ADMIT-OK, exit 0
        same binary, same card, told its real figure -> ErrBudgetExceeded, exit 10
      The only difference was whether a human kept the second variable in step.
      Post-fix the 27B is withheld "short by 7289MiB" and nothing starts.
      The catalogue DID already cover the family (6 FamilyText entries), so the
      agent selected from them and added no entries and invented no figures.
      ENV VARS NOT SILENTLY DROPPED: AGENTGEN_MODEL_GGUF became an OUTPUT
      (reported as IGNORED-CONFIG), NEED_BYTES is reported and ignored,
      MODEL_DIR stays an input, and deliberate naming moved to --pin, validated
      against the catalogue and refused with the short resource named.
      A new guard walks the boot roots ON DISK and requires each selecting one
      to state the broker's margin, with a floor of 4 so a broken glob cannot
      pass vacuously. It found all four. The previous test asserted this only of
      the function, which would not have caught a lane that never called it.
    severity: HIGH
    status: fixed + guarded

  - id: OPEN-24
    title: the lane's three former candidates are not in the catalogue, so they can no longer run
    detail: |
      NEEDS AN OPERATOR DECISION — this is a real narrowing of what the lane can
      serve, and it is the flip side of the FR-056 fix.
      Mistral-Nemo-Instruct-2407, GLM-4.7-Flash and DeepSeek-Coder-V2-Lite were
      the lane's configured candidates. None is in the catalogue. The agent's
      framing is right: that IS the finding rather than an obstacle — they had
      no measured footprint anyone could check, which is precisely what the
      static 9 GiB placeholder stood in for.
      CONSEQUENCE: an operator who has a working Mistral-Nemo GGUF today will
      now be REFUSED rather than served. The commit says so plainly.
      The agent could not add them honestly: this host has no ~/models directory
      and therefore no GGUF to size, and it declined to guess (correctly — see
      SELF-7, where a guessed measurement was written into a data file).
      RESOLUTION NEEDS ONE OF: measure those GGUFs on a host that has them and
      add catalogue entries with recorded provenance; or accept the narrowed
      candidate set.
    severity: HIGH
    status: open — operator decision

  - id: OPEN-25
    title: five of six text entries skip the device axis, then hand a host-RAM figure to a VRAM broker
    detail: |
      Flagged by the agentgen agent rather than changed, correctly — altering
      selection semantics inside a change about one lane would have been the
      wrong place for it.
      Those entries carry requires_accelerator: false, so selection skips the
      accelerator axis entirely and the figure that reaches vrambroker.Acquire
      is a host-RAM measurement. That is the CRITICAL-5 shape again in a
      narrower form: a number checked against one kind of memory being spent
      against another.
      The vision lane already has the same shape, so this is not new and not
      isolated — which is the argument for fixing it as its own change.
    severity: MEDIUM
    status: open

  - id: OPEN-26
    title: modelchoice.go is now the fourth near-identical copy of one decision
    detail: |
      catalogueDir through refusalError is BYTE-IDENTICAL across the videogen,
      imagegen, visiongen and agentgen lanes.
      The agent declined to extract it, and gave the right reason: doing so
      would rewrite three currently-correct lanes inside a change about a
      fourth, with other agents live in the same checkout. It recorded the count
      in the file instead, so the case keeps growing visibly rather than
      silently.
      Worth doing when the checkout is quiet. Four copies is where a divergence
      becomes likely — and this feature has already been bitten once by two
      copies of one fact disagreeing (SELF-9, the precision lists).
    severity: MEDIUM
    status: open — deliberate deferral, not an oversight

  - id: TOOLKIT-1-2-3
    title: all three toolkit findings confirmed; two of their severity claims refuted
    detail: |
      FINDING 1 — CONFIRMED, severity reasoning REFUTED. jq's @tsv escapes only
      backslash, tab, newline and CR — NOT "/" or ":". Verified: both
      "helixllm/h/org/llama3:8b" and "hf.co/TheBloke/x:q4" pass through
      BYTE-IDENTICAL. So the reviewer's claim that this "breaks the common case"
      of org/model and hf.co names was wrong; it bit backslash- and
      control-character-bearing names only. Real, narrower.
      FINDING 2 — CONFIRMED, sub-claim REFUTED, and the practical impact is
      different from the report. The discovery secret is read by NO HTTP
      middleware — but neither is it "consumed by placement logic": placement
      consumes a pre-computed Trusted boolean, and the secret signs OUTBOUND
      attestation on a different path with its own nonce/proof headers.
      The important correction: the server's DEFAULT is open access, so the
      common case was never the reported 401. It was the request SUCCEEDING
      while the secret was disclosed to every configured host for nothing.
      FINDING 3 — CONFIRMED exactly as reported. A withdrawn model's .env and
      alias survived and stayed invocable.
      DELETION SAFETY is the part worth keeping. A record is retired only when
      three things hold: it carries a marker written by exactly ONE line in
      --apply (so hand-authored records and sync-written facade providers are
      structurally invisible), its host ANSWERED THIS RUN, and that answering
      host no longer lists it.
      The middle gate is the one that matters, and the reasoning is PATTERN-1
      applied to deletion: an unreachable host and a host that stopped serving
      everything produce IDENTICAL empty results, so silence is never treated
      as evidence. The mutation proves the danger — disabling that gate lets an
      unreachable host wipe the user's config. Removal reuses cmd_remove, which
      moves the directory aside rather than deleting.
    severity: HIGH
    status: fixed + guarded (commit pending final suite)

  - id: NOTE-4
    title: reviews produce leads, not facts — three severity claims have now failed verification
    detail: |
      Worth stating as a pattern, because it has held every time and it changed
      what got built.
        * T055 claimed OpenAI-compat local backends are "silently dropped" —
          REFUTED: deliberate design, and fixing it would have stamped
          identities on proxied vendor models, which the design forbids.
        * T055 claimed the @tsv escaping "breaks the common case" of org/model
          and hf.co names — REFUTED: @tsv does not escape "/" or ":" at all.
        * T055's Bearer-secret finding predicted 401s — REFUTED in practice:
          the default is open access, so requests SUCCEEDED while leaking the
          secret. Worse than reported, in a different way.
      In every case the agent verified before acting, and in every case the fix
      that shipped differs from the fix the report implied. A review finding is
      a place to look, not a thing to implement.
    severity: INFO
    status: recorded

  - id: OPEN-19-resolved
    title: the integration tests never needed live services; the endpoint was never wired to the mock
    detail: |
      Both failures came from ONE missing line in the test framework, and no
      service of any kind was required.
      /v1/models is served from RouterOptions.ModelBrain, a SEPARATE option from
      Brain — the listing handlers need the concrete *brain.Brain for Models(),
      while Brain is an interface that may be a fallback.Chain. The framework
      set Brain and left ModelBrain nil, so the handler took its no-backend
      branch and listed nothing. The tests predate that split and the framework
      was never updated when /v1/models moved off Brain.
      Meanwhile the framework registers a mock provider reporting FOUR models
      and answering Available() true. It was simply never connected.
      FIXED with `ModelBrain: b`. Both pass; removing it fails both with the
      original message. helix_llm now has no failing package.
      WHY THIS LASTED, and it is the useful part: THREE separate agents hit
      these tests in this session. Every one did the right thing — proved the
      failures pre-dated its own work, one via `go list -deps -test` showing
      zero dependency edges, another by re-running at pristine HEAD in an
      isolated worktree. Then each stopped, because "needs live services" is a
      plausible story for a red integration test and nobody had cause to doubt
      it. I recorded that assumption myself in OPEN-19, flagging it as an
      assumption — and still did not check it for hours.
      PROVING A FAILURE IS NOT YOURS IS NOT THE SAME AS FINDING OUT WHAT IT IS.
      The first is a defensive check and the whole fleet did it correctly. The
      second is the actual question, and nobody asked it.
    severity: MEDIUM
    status: fixed + guarded

  - id: OPEN-27
    title: the RouterOptions doc comment describes a hardcoded model list that no longer exists
    detail: |
      RouterOptions.ModelBrain's comment says "When nil the endpoints return the
      built-in hardcoded model list."
      That list is gone — it was removed as a fabricated three-entry list
      advertising models the server could never serve (the i18n keys that
      replaced it say so). The endpoints now return an empty list with a reason.
      Not fixed here only because another agent is live in that package right
      now. Small, and worth doing: a stale comment describing removed behaviour
      is how the ModelBrain wiring gap stayed invisible.
    severity: LOW
    status: open
