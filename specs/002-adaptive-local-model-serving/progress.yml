  - id: SECURITY-1
    where: helix_code/config/config.yaml:28 + internal/config/config.go:711
    what: >-
      A SERVER STARTED WITHOUT HELIX_AUTH_JWT_SECRET SIGNS TOKENS WITH A
      PUBLICLY-KNOWN LITERAL. Confirmed by tracing the startup path, not inferred:
        - config.yaml ships  jwt_secret: "${HELIX_AUTH_JWT_SECRET}"
        - expandShellDefaults expands Redis host and DB host/user/dbname/server
          address. It does NOT expand auth, so the placeholder stays literal.
        - validateConfig (line 711) rejects only "" and
          "default-secret-change-in-production". The 24-character literal
          "${HELIX_AUTH_JWT_SECRET}" is neither, so it PASSES.
        - the len(JWTSecret) >= 32 checks that WOULD catch it live in
          ConfigurationValidator.Validate / ValidateField — and Load() never
          calls them. NewConfigurationValidator appears only in doc.go comments
          and its own definition. NO PRODUCTION CALLER.
      Result: anyone who clones the repo and starts the server without setting
      that variable — the default state — signs JWTs with a 24-byte string that
      is committed in this repository. Tokens are forgeable by anyone who reads
      the config file.
      NOT FIXED. Two candidate fixes with different blast radii: expand auth in
      expandShellDefaults (then an unset var yields "" and the existing check
      fires), or reject any secret still containing an unexpanded ${...}. The
      second is narrower and catches the whole class. Needs an operator decision
      because it will refuse startup for anyone currently relying on the
      accidental behaviour.
      NOTE ON MY OWN VERIFICATION: my first probe reported the placeholder as
      REJECTED. That was a false pass — I passed an empty Config{}, so
      validateConfig failed on an unrelated missing field. The same vacuity trap
      recorded as PATTERN-1, hit by me while checking for it.
    severity: CRITICAL (security)
    status: open — operator decision required

