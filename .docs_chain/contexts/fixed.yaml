context: fixed
description: >-
  Closed-archive tracker chain (Fixed_Summary parity). Fixed.md AND
  Fixed_Summary.md are both generated FROM the SQLite single source of truth by
  the workable-items exporter (out-of-band, see the DATA-LOSS FIX note below);
  this context regenerates ONLY their synchronized HTML + PDF exports.
  Mandates: §11.4.53 (Fixed_Summary parity), §11.4.19 (column alignment),
  §11.4.93/§11.4.95 (DB single source of truth, DB tracked).
  Supersedes: sync_issues_docs.sh (Fixed stage).
  #
  # ============================================================================
  # DATA-LOSS FIX (§11.4.102 systematic-debugging + §11.4.120 gate reconciliation,
  # 2026-07-28) — DO NOT RE-ADD THE `gen-fixed-summary` EDGE.
  # ============================================================================
  # The PRIOR revision declared:
  #     - { type: derive-from, from: fixed_md, to: fixed_summary,
  #         transform: gen-fixed-summary }
  #     gen-fixed-summary: { exec: "scripts/generate_fixed_summary.sh",
  #                          args: ["--stdout"] }
  # i.e. it derived the SUMMARY from the MARKDOWN — the exact INVERSE of the
  # §11.4.93 `db-to-md` direction. This context declared no DB node at all, so
  # nothing recorded that docs/Fixed.md is itself DB-derived
  # (export.go -> renderDocument(db, "Fixed")).
  #
  # WHY THAT IS DESTRUCTIVE (measured read-only 2026-07-28, not estimated):
  #   * docs/workable_items.db `items`      = 344 rows (239 distinct atm_id),
  #     ALL at current_location='Fixed', split 188 `representation='table'`
  #     + 156 `representation='section'`.
  #   * docs/Fixed.md carries exactly those two surface forms: 188 pipe-table
  #     rows + 156 `## ` H2 sections (188 + 156 = 344).
  #   * The committed, DB-derived docs/Fixed_Summary.md carries all 344
  #     ("**TOTAL** | | **344**" and 344 numbered per-item rows).
  #   * scripts/generate_fixed_summary.sh counts ONLY pipe rows whose column 1
  #     matches /^[0-9]{4}-[0-9]{2}-[0-9]{2}$/ (its awk predicate, lines 57-70) —
  #     the 156 H2 sections are INVISIBLE to it. Replaying that predicate
  #     read-only against docs/Fixed.md yields:
  #         BUG=79 FEAT=79 TASK=30 OBSOLETE=1 TOTAL=188
  #     versus the committed DB-derived Bug 163+3 / Feature 95 / Task 80+3 /
  #     TOTAL 344.
  #   => Running it rewrites 344 -> 188: 156 items of tracked state destroyed,
  #      every per-type count corrupted (Bug 166->79, Feature 95->79,
  #      Task 83->30, Obsolete 3->1), and the entire 344-row per-item table
  #      dropped — the generator emits aggregate counts only, no Items table.
  # This is the trap recorded in RESUME.md:192. Because docs_chain would run the
  # transform AUTOMATICALLY on `sync`, the inverted edge armed that destruction
  # to fire the moment the engine is installed (gate G14 currently SKIPs with
  # "docs_chain engine absent").
  #
  # THE FIX (same resolution already proven in .docs_chain/contexts/features.yaml,
  # where a lossy generator wired as a derive-transform CLOBBERED a hand-authored
  # ledger): the inverted `derive-from` edge AND its `gen-fixed-summary`
  # transform are DROPPED. Fixed.md and Fixed_Summary.md are declared
  # `kind: markdown` SOURCES at this layer — both are produced FROM THE DB
  # out-of-band by
  #     constitution/scripts/workable-items/bin/workable-items export --db <db>
  # (cmd/workable-items/export.go -> renderDocument(db,"Fixed") and
  # renderFixedSummary(loadItems(db)); it emits the committed "regenerated from
  # the SQLite single-source-of-truth (§11.4.53)" header). docs_chain therefore
  # regenerates ONLY the .html/.pdf exports and can never overwrite either
  # tracker. scripts/generate_fixed_summary.sh remains on disk but is UNWIRED —
  # it must not be re-attached as a transform.
  #
  # WHY THE DB->SUMMARY EDGE IS NOT EXPRESSED HERE (§11.4.6, honest boundary):
  # a `derive-from` edge is one-transform-per-target-node, and the pre-existing
  # transforms pass `--stdout`, implying the engine captures a transform's stdout
  # as the target's content. The DB-authoritative generator (`workable-items
  # export`) has neither shape: it takes `--db`/`--out-dir` and WRITES FOUR files
  # itself (Issues.md, Fixed.md, Issues_Summary.md, Fixed_Summary.md) with no
  # stdout mode, so one edge per target cannot faithfully invoke it. No DB node
  # or md<->db sync edge is added here either: the single `workable-items sync`
  # invocation is already declared once in .docs_chain/contexts/issues.yaml and
  # regenerates BOTH trackers, so duplicating it here would double-invoke it.
  # UNCONFIRMED: the engine is absent from this host, so its exact `derive-from`
  # transform contract could not be verified empirically — the `--stdout`
  # convention in the pre-existing transforms is the evidence for the
  # stdout-capture reading.
  # ============================================================================
nodes:
  # SOURCES at this layer — both produced FROM docs/workable_items.db by
  # `workable-items export`. NEVER declare a derive-from edge into either of
  # these nodes from the other, or from any Markdown (see above).
  fixed_md:      { kind: markdown, path: docs/Fixed.md }
  fixed_summary: { kind: markdown, path: docs/Fixed_Summary.md }
  fixed_html:    { kind: html,     path: docs/Fixed.html }
  fixed_pdf:     { kind: pdf,      path: docs/Fixed.pdf }
  fsum_html:     { kind: html,     path: docs/Fixed_Summary.html }
  fsum_pdf:      { kind: pdf,      path: docs/Fixed_Summary.pdf }
edges:
  # Export-only edges. NO markdown -> summary edge: that direction is the
  # inverted, data-destroying one documented above.
  - { type: derive-from, from: fixed_md,      to: fixed_html,    transform: md-to-html }
  - { type: derive-from, from: fixed_html,    to: fixed_pdf,     transform: html-to-pdf }
  - { type: derive-from, from: fixed_summary, to: fsum_html,     transform: md-to-html }
  - { type: derive-from, from: fsum_html,     to: fsum_pdf,      transform: html-to-pdf }
transforms:
  # REMOVED (2026-07-28): gen-fixed-summary ->
  #   scripts/generate_fixed_summary.sh --stdout
  # It reads docs/Fixed.md (SRC="$ROOT/docs/Fixed.md", line 44), i.e. the
  # markdown, NOT the DB, and sees only its 188 pipe rows. Re-adding it re-arms
  # the 344 -> 188 data-loss trap above.
  md-to-html:        { builtin: pandoc-html }
  html-to-pdf:       { builtin: weasyprint-pdf }
